name: Release
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    name: Verify & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate Release version
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          
          GRADLE_VERSION=$(grep -E "^version\s*=" gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          
          echo "Tag version: $TAG_VERSION"
          echo "Gradle version: $GRADLE_VERSION"
          
          if [[ "$GRADLE_VERSION" =~ (dev|SNAPSHOT) ]]; then
            echo "::error::Cannot release a build containing '-dev' or '-SNAPSHOT' ($GRADLE_VERSION)"
            exit 1
          fi
          
          if [ "$TAG_VERSION" != "$GRADLE_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match gradle.properties version ($GRADLE_VERSION)"
            exit 1
          fi
          
          echo "clean_version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Run Tests
        run: ./gradlew test

      - name: Publish to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: ./gradlew modrinth

      - name: Create GitHub Release Announcement
        uses: softprops/action-gh-release@v2
        with:
          name: "Velocity-WoL ${{ steps.version.outputs.clean_version }}"
          generate_release_notes: true
          body: |
            ### 📥 Download
            
            Downloads are hosted on **Modrinth**:
            👉 **[Download Velocity-WoL ${{ steps.version.outputs.clean_version }} on Modrinth](https://modrinth.com/plugin/velocity-wol/version/${{ steps.version.outputs.clean_version }})**
          files: build/libs/*.jar
